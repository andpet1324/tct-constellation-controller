[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tct-constellation"
version = "0.1.0"
description = "Scans and analysis for the TCT setup, driving Constellation satellites"
requires-python = ">=3.11"
dependencies = [
    "ConstellationDAQ[cli,hdf5]",
    "numpy",
    "h5py",
    "scipy",
    "matplotlib",
]

[project.scripts]
tct-monitor = "tct.monitor:main"
tct-menu = "tct.menu:main"

[tool.setuptools.packages.find]
include = ["tct*"]
